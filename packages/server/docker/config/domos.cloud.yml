mode: cloud

server:
  port: 3000
  host: "0.0.0.0"
  adminPassword: ${ADMIN_PASSWORD}

llm:
  provider: google
  model: gemini-2.0-flash-001

live:
  provider: google
  model: gemini-2.0-flash-live-001
  voice: Kore

speech:
  stt:
    provider: google
    language: fr-FR
  tts:
    provider: google
    language: fr-FR

persistence:
  type: sqlite
  path: /data/domos.db

cloud:
  jwt:
    publicKeyPath: /keys/public.pem
    privateKeyPath: /keys/private.pem
    issuer: domos.cloud
    audience: domos-api
    expiresIn: 7d

  database:
    provider: postgresql
    url: ${DATABASE_URL}

  redis:
    url: ${REDIS_URL}

  billing:
    stripeSecretKey: ${STRIPE_SECRET_KEY}
    webhookSecret: ${STRIPE_WEBHOOK_SECRET}
    plans:
      - id: free
        name: Free
        limits:
          sessionsPerDay: 50
          tokensPerMonth: 1000000
          agentsMax: 2
          linesMax: 1
      - id: pro
        name: Pro
        stripePriceId: ${STRIPE_PRICE_PRO}
        limits:
          sessionsPerDay: 500
          tokensPerMonth: 10000000
          agentsMax: 10
          linesMax: 5
      - id: enterprise
        name: Enterprise
        stripePriceId: ${STRIPE_PRICE_ENTERPRISE}
        limits:
          sessionsPerDay: 10000
          tokensPerMonth: 100000000
          agentsMax: 100
          linesMax: 50

  storeConnect:
    shopify:
      clientId: ${SHOPIFY_CLIENT_ID}
      clientSecret: ${SHOPIFY_CLIENT_SECRET}
      scopes:
        - read_products
        - read_orders
        - read_inventory
        - write_orders
      webhookSecret: ${SHOPIFY_WEBHOOK_SECRET}
    woocommerce:
      callbackUrl: ${WOO_CALLBACK_URL}

plugins: []
