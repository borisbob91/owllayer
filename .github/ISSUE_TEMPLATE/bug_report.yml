name: Bug report
description: Report reproducible unexpected behavior in OwlLayer AI.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include API keys, tokens, credentials, or security vulnerabilities. Use SECURITY.md for private vulnerability reporting.
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - "@owllayer/core"
        - "@owllayer/ui"
        - "@owllayer/browser"
        - "@owllayer/react"
        - "@owllayer/vue"
        - "@owllayer/svelte"
        - "@owllayer/angular"
        - "@owllayer/server"
        - "@owllayer/adapter-openai"
        - "@owllayer/adapter-google"
        - "@owllayer/adapter-anthropic"
        - "@owllayer/adapter-livekit"
        - "Legacy @domos package"
        - "Documentation"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its user impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example and exact steps.
      placeholder: |
        1. Install ...
        2. Configure ...
        3. Call ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OwlLayer AI version
      placeholder: "e.g. @owllayer/core 0.1.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Node.js, package manager, browser/framework and version"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
