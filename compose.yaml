name: domos

services:
  server:
    build:
      context: .
      dockerfile: apps/demo-server/Dockerfile
    image: domos-server:${DOMOS_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 4001
      DOMOS_REQUIRE_API_KEY: ${DOMOS_REQUIRE_API_KEY:-true}
      DOMOS_LIVEKIT_ALLOWED_ORIGINS: ${DOMOS_LIVEKIT_ALLOWED_ORIGINS:-http://localhost:5173}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    expose:
      - "4001"
    ports:
      - "${DOMOS_PORT:-4001}:4001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const n=require('node:net');const s=n.connect(4001,'127.0.0.1',()=>{s.end();process.exit(0)});s.setTimeout(3000,()=>process.exit(1));s.on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 4s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:7-alpine
    profiles: ["livekit-selfhosted"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${LIVEKIT_REDIS_PASSWORD}"]
    volumes:
      - livekit_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$LIVEKIT_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      LIVEKIT_REDIS_PASSWORD: ${LIVEKIT_REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true

  livekit:
    image: livekit/livekit-server:${LIVEKIT_SERVER_TAG:-v1.13.1}
    profiles: ["livekit-selfhosted"]
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_REDIS_PASSWORD: ${LIVEKIT_REDIS_PASSWORD}
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880/tcp"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881/tcp"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2.8-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      DOMOS_DOMAIN: ${DOMOS_DOMAIN:-localhost}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-livekit.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
  livekit_redis_data:
