server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Try serving the file, then file.html (for clean URLs), then index, fallback to 404
        try_files $uri $uri.html $uri/ /404.html;
    }

    error_page 404 /404.html;
}
