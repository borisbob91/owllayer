<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Tool execution in OwlLayerServer</title>
  <desc id="desc">The client context feeds the session tools, the LLM adapter asks for a tool, the HITL middleware checks it, then ToolRouter runs a server handler or sends TOOL_CALL to the client before the final AGENT_RESPONSE.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#566579"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#198967"/></marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f6be0"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #17263a; }
      .subtitle { font-size: 14px; fill: #53657b; }
      .heading { font-size: 15px; font-weight: 700; fill: #11355f; }
      .body { font-size: 13px; fill: #34485f; }
      .label { font-size: 12px; font-weight: 700; fill: #425874; }
      .code { font-family: "Cascadia Code", Consolas, monospace; }
      .box-blue { fill: #e9f3ff; stroke: #4e87c5; stroke-width: 1.4; }
      .box-green { fill: #e6f7f0; stroke: #299174; stroke-width: 1.4; }
      .box-orange { fill: #fff1e9; stroke: #ce693e; stroke-width: 1.4; }
      .box-violet { fill: #f0efff; stroke: #736dd6; stroke-width: 1.4; }
      .box-neutral { fill: #f7f9fb; stroke: #91a1b2; stroke-width: 1.4; }
      .flow { fill: none; stroke: #566579; stroke-width: 1.8; marker-end: url(#arrow); }
      .result { fill: none; stroke: #198967; stroke-width: 1.8; marker-end: url(#arrow-green); }
      .dash { fill: none; stroke: #4f6be0; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#arrow-dash); }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="778" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="42" y="46" class="title">Tool execution in OwlLayerServer</text>
  <text x="42" y="72" class="subtitle">Text turn: session tools, HITL check, routing, and result</text>

  <rect x="42" y="112" width="190" height="86" rx="8" class="box-violet"/>
  <text x="137" y="142" text-anchor="middle" class="heading">OwlLayerClient</text>
  <text x="137" y="166" text-anchor="middle" class="body">Tools on the page</text>
  <text x="137" y="184" text-anchor="middle" class="body">+ visible context</text>

  <rect x="340" y="112" width="220" height="86" rx="8" class="box-blue"/>
  <text x="450" y="142" text-anchor="middle" class="heading">Session</text>
  <text x="450" y="166" text-anchor="middle" class="body">Effective tools: server</text>
  <text x="450" y="184" text-anchor="middle" class="body">+ interface tools</text>

  <rect x="640" y="112" width="220" height="86" rx="8" class="box-blue"/>
  <text x="750" y="142" text-anchor="middle" class="heading code">LLMAdapter.chat()</text>
  <text x="750" y="166" text-anchor="middle" class="body">Messages + context</text>
  <text x="750" y="184" text-anchor="middle" class="body">+ tool declarations</text>

  <rect x="940" y="112" width="218" height="86" rx="8" class="box-violet"/>
  <text x="1049" y="142" text-anchor="middle" class="heading">AI model</text>
  <text x="1049" y="166" text-anchor="middle" class="body">Text answer</text>
  <text x="1049" y="184" text-anchor="middle" class="body">or tool calls</text>

  <path d="M232 155 H338" class="dash"/>
  <text x="285" y="143" text-anchor="middle" class="label code" font-size="11">CONTEXT_UPDATE</text>
  <path d="M560 155 H638" class="flow"/>
  <text x="599" y="143" text-anchor="middle" class="label">tools</text>
  <path d="M860 155 H938" class="flow"/>
  <text x="899" y="143" text-anchor="middle" class="label">request</text>

  <rect x="712" y="266" width="272" height="88" rx="8" class="box-orange"/>
  <text x="848" y="296" text-anchor="middle" class="heading code">HITLSecurityMiddleware</text>
  <text x="848" y="320" text-anchor="middle" class="body">Tool known in the session,</text>
  <text x="848" y="338" text-anchor="middle" class="body">risk level, blockTool()</text>
  <path d="M1049 198 V232 H848 V264" class="flow"/>
  <text x="1002" y="224" text-anchor="middle" class="label">tool calls</text>

  <rect x="712" y="408" width="272" height="72" rx="8" class="box-blue"/>
  <text x="848" y="438" text-anchor="middle" class="heading code">ToolRouter.route()</text>
  <text x="848" y="460" text-anchor="middle" class="body">Picks the handler</text>
  <path d="M848 354 V406" class="flow"/>
  <text x="860" y="385" class="label">allowed</text>

  <rect x="42" y="280" width="560" height="92" rx="8" class="box-neutral"/>
  <text x="62" y="308" class="heading">Key point</text>
  <text x="62" y="332" class="body">The model sees server tools and the interface tools</text>
  <text x="62" y="352" class="body">sent by CONTEXT_UPDATE. Server tools win on name collisions.</text>

  <rect x="212" y="548" width="246" height="88" rx="8" class="box-violet"/>
  <text x="335" y="578" text-anchor="middle" class="heading">Interface tool handler</text>
  <text x="335" y="602" text-anchor="middle" class="body">Runs in the page</text>
  <text x="335" y="620" text-anchor="middle" class="body">then TOOL_RESULT</text>

  <rect x="714" y="548" width="268" height="88" rx="8" class="box-green"/>
  <text x="848" y="578" text-anchor="middle" class="heading">Server tool handler</text>
  <text x="848" y="602" text-anchor="middle" class="body">Runs in Node.js</text>
  <text x="848" y="620" text-anchor="middle" class="body">(registered on the server)</text>

  <path d="M786 480 V512 H335 V546" class="flow"/>
  <text x="520" y="504" text-anchor="middle" class="label">interface tool: <tspan class="code">TOOL_CALL</tspan> over AITP</text>
  <path d="M910 480 V546" class="flow"/>
  <text x="922" y="520" class="label">server tool</text>

  <rect x="449" y="686" width="302" height="72" rx="8" class="box-blue"/>
  <text x="600" y="716" text-anchor="middle" class="heading code">llm.handleToolResult()</text>
  <text x="600" y="740" text-anchor="middle" class="body">AGENT_RESPONSE to the client</text>
  <path d="M335 636 V722 H447" class="result"/>
  <path d="M848 636 V722 H753" class="result"/>
</svg>
