<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Risk policy before every tool call</title>
  <desc id="desc">Each TOOL_CALL goes through the HITL policy. none runs directly, low runs and notifies the user, high and critical wait for the user's approval, and a tool blocked with server.blockTool never runs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 14px; fill: #475569; }
      .code { font-family: "Cascadia Code", Consolas, monospace; font-weight: 700; }
      .pill { font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; font-weight: 700; fill: #334155; }
      .head { font-size: 16px; font-weight: 700; }
      .body { font-size: 12.5px; fill: #475569; }
      .icon { font-size: 18px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect x="1" y="1" width="1098" height="558" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="550" y="46" text-anchor="middle" class="title">Risk policy before every tool call</text>
  <text x="550" y="72" text-anchor="middle" class="sub">The handler runs only when the policy allows it</text>

  <rect x="450" y="94" width="200" height="46" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="123" text-anchor="middle" class="code" font-size="16" fill="#0f172a">TOOL_CALL</text>
  <path d="M550 140 V172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="430" y="174" width="240" height="64" rx="32" fill="#0f766e"/>
  <text x="550" y="202" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">HITL policy</text>
  <text x="550" y="222" text-anchor="middle" font-size="12.5" fill="#ccfbf1">reads the tool's risk level</text>

  <path d="M670 206 H858" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
  <text x="764" y="196" text-anchor="middle" class="body" fill="#dc2626" font-weight="700">blocked tool</text>
  <rect x="860" y="178" width="200" height="56" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="960" y="202" text-anchor="middle" class="head" fill="#b91c1c">Never runs</text>
  <text x="960" y="222" text-anchor="middle" class="code" font-size="12" fill="#b91c1c">server.blockTool()</text>

  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M550 238 V270"/>
    <path d="M160 270 H940"/>
    <path d="M160 270 V296"/><path d="M420 270 V296"/><path d="M680 270 V296"/><path d="M940 270 V296"/>
  </g>
  <g>
    <rect x="110" y="296" width="100" height="30" rx="15" fill="#ffffff" stroke="#94a3b8"/><text x="160" y="316" text-anchor="middle" class="pill">none</text>
    <rect x="370" y="296" width="100" height="30" rx="15" fill="#ffffff" stroke="#94a3b8"/><text x="420" y="316" text-anchor="middle" class="pill">low</text>
    <rect x="630" y="296" width="100" height="30" rx="15" fill="#ffffff" stroke="#94a3b8"/><text x="680" y="316" text-anchor="middle" class="pill">high</text>
    <rect x="890" y="296" width="100" height="30" rx="15" fill="#ffffff" stroke="#94a3b8"/><text x="940" y="316" text-anchor="middle" class="pill">critical</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M160 326 V352"/><path d="M420 326 V352"/><path d="M680 326 V352"/><path d="M940 326 V352"/>
  </g>

  <rect x="50" y="354" width="220" height="124" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="160" cy="386" r="16" fill="#16a34a"/><text x="160" y="392" text-anchor="middle" class="icon">✓</text>
  <text x="160" y="424" text-anchor="middle" class="head" fill="#15803d">Runs directly</text>
  <text x="160" y="446" text-anchor="middle" class="body">Read, search, navigate</text>

  <rect x="310" y="354" width="220" height="124" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="420" cy="386" r="16" fill="#16a34a"/><text x="420" y="392" text-anchor="middle" class="icon">✓</text>
  <text x="420" y="424" text-anchor="middle" class="head" fill="#15803d">Runs and notifies</text>
  <text x="420" y="446" text-anchor="middle" class="body">Add to cart, preferences</text>

  <rect x="570" y="354" width="220" height="124" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <circle cx="680" cy="386" r="16" fill="#d97706"/><text x="680" y="392" text-anchor="middle" class="icon">!</text>
  <text x="680" y="424" text-anchor="middle" class="head" fill="#b45309">Waits for approval</text>
  <text x="680" y="446" text-anchor="middle" class="body">Delete, important settings</text>

  <rect x="830" y="354" width="220" height="124" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <circle cx="940" cy="386" r="16" fill="#dc2626"/><text x="940" y="392" text-anchor="middle" class="icon">!!</text>
  <text x="940" y="424" text-anchor="middle" class="head" fill="#b91c1c">Waits for approval</text>
  <text x="940" y="446" text-anchor="middle" class="body">Highlighted dialog: payment,</text>
  <text x="940" y="464" text-anchor="middle" class="body">irreversible actions</text>

  <rect x="210" y="502" width="680" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="550" y="525" text-anchor="middle" class="body"><tspan font-weight="700" fill="#15803d">Approved:</tspan> the handler runs and returns its result.   <tspan font-weight="700" fill="#b91c1c">Refused:</tspan> an error result, never a success.</text>
</svg>
