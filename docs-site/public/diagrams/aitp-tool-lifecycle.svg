<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">One tool call over AITP</title>
  <desc id="desc">Sequence between OwlLayerClient, OwlLayerServer and the model: CONTEXT_UPDATE, USER_INPUT, the model requests a tool, TOOL_CALL, the handler runs after the risk policy, TOOL_RESULT, the model answers, AGENT_RESPONSE.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6d28d9"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#15803d"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 14px; fill: #475569; }
      .actor { font-size: 15px; font-weight: 700; }
      .actor-sub { font-size: 12px; fill: #475569; }
      .msg { font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; font-weight: 700; }
      .note { font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect x="1" y="1" width="1098" height="648" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="550" y="46" text-anchor="middle" class="title">One tool call over AITP</text>
  <text x="550" y="72" text-anchor="middle" class="sub">The interface declares, the model decides, your code runs</text>

  <rect x="80" y="94" width="220" height="56" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="190" y="118" text-anchor="middle" class="actor" fill="#1d4ed8">OwlLayerClient</text>
  <text x="190" y="138" text-anchor="middle" class="actor-sub">in the browser</text>
  <rect x="490" y="94" width="220" height="56" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="600" y="118" text-anchor="middle" class="actor" fill="#c2410c">OwlLayerServer</text>
  <text x="600" y="138" text-anchor="middle" class="actor-sub">session and routing</text>
  <rect x="840" y="94" width="220" height="56" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="950" y="118" text-anchor="middle" class="actor" fill="#6d28d9">LLM</text>
  <text x="950" y="138" text-anchor="middle" class="actor-sub">through its adapter</text>

  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 6">
    <line x1="190" y1="150" x2="190" y2="626"/>
    <line x1="600" y1="150" x2="600" y2="626"/>
    <line x1="950" y1="150" x2="950" y2="626"/>
  </g>

  <path d="M190 186 H598" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="395" y="178" text-anchor="middle" class="msg" fill="#2563eb">CONTEXT_UPDATE <tspan class="note" font-weight="400">tools + context</tspan></text>

  <path d="M190 236 H598" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="395" y="228" text-anchor="middle" class="msg" fill="#2563eb">USER_INPUT <tspan class="note" font-weight="400">"add two headphones"</tspan></text>

  <path d="M600 286 H948" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <text x="775" y="278" text-anchor="middle" class="note" fill="#6d28d9" font-weight="700">messages + context + tools</text>

  <path d="M950 330 H602" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <text x="775" y="322" text-anchor="middle" class="note" fill="#6d28d9" font-weight="700">tool call: add_to_cart</text>

  <path d="M600 376 H192" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="395" y="368" text-anchor="middle" class="msg" fill="#2563eb">TOOL_CALL</text>

  <path d="M190 396 H246 V446 H194" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="258" y="416" class="note" fill="#0f766e" font-weight="700">risk policy, then</text>
  <text x="258" y="434" class="note" fill="#0f766e" font-weight="700">your handler runs</text>

  <path d="M190 486 H598" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="395" y="478" text-anchor="middle" class="msg" fill="#2563eb">TOOL_RESULT</text>

  <path d="M600 526 H948" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <text x="775" y="518" text-anchor="middle" class="note" fill="#6d28d9" font-weight="700">tool result</text>

  <path d="M950 566 H602" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <text x="775" y="558" text-anchor="middle" class="note" fill="#6d28d9" font-weight="700">final answer</text>

  <path d="M600 606 H192" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="395" y="598" text-anchor="middle" class="msg" fill="#15803d">AGENT_RESPONSE</text>
</svg>
