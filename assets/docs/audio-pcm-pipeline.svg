<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
  <title id="title">Audio playback pipeline</title>
  <desc id="desc">PCM chunks from the agent are validated, played through a resumed AudioContext, scheduled on nextStartTime and played without gaps. On stop, nodes are disconnected and tracks stopped; AudioContext.close() is never called.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 14px; fill: #475569; }
      .head { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 12.5px; fill: #475569; }
      .rule { font-family: "Cascadia Code", Consolas, monospace; font-size: 11.5px; font-weight: 700; fill: #1d4ed8; }
    </style>
  </defs>

  <rect x="1" y="1" width="1098" height="378" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="550" y="46" text-anchor="middle" class="title">Audio playback pipeline</text>
  <text x="550" y="72" text-anchor="middle" class="sub">How the agent's PCM chunks play without gaps and without freezing the interface</text>

  <g>
    <rect x="30" y="104" width="180" height="160" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="70" y="124" width="100" height="44" rx="8" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="98" cy="146" r="4" fill="#2563eb"/><circle cx="120" cy="146" r="4" fill="#2563eb"/><circle cx="142" cy="146" r="4" fill="#2563eb"/>
    <text x="120" y="198" text-anchor="middle" class="head">PCM chunks</text>
    <text x="120" y="220" text-anchor="middle" class="body">base64 audio from</text>
    <text x="120" y="238" text-anchor="middle" class="body">the server</text>

    <rect x="245" y="104" width="180" height="160" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
    <path d="M300 126 H370 L345 152 V168 L325 160 V152 Z" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="335" y="198" text-anchor="middle" class="head">Validate</text>
    <text x="335" y="220" text-anchor="middle" class="body">Even byte length</text>
    <text x="335" y="240" text-anchor="middle" class="rule">R3</text>

    <rect x="460" y="104" width="180" height="160" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
    <circle cx="550" cy="146" r="24" fill="none" stroke="#0f766e" stroke-width="2.5"/>
    <path d="M534 146 C540 132 546 132 550 146 C554 160 560 160 566 146" fill="none" stroke="#0f766e" stroke-width="2.5"/>
    <text x="550" y="198" text-anchor="middle" class="head">AudioContext</text>
    <text x="550" y="220" text-anchor="middle" class="body">Resumed if suspended</text>
    <text x="550" y="240" text-anchor="middle" class="rule">R5</text>

    <rect x="675" y="104" width="180" height="160" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
    <path d="M700 132 H830" stroke="#0f766e" stroke-width="2"/>
    <path d="M765 124 V170" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="705" y="142" width="58" height="12" rx="4" fill="#99f6e4" stroke="#0f766e"/>
    <rect x="767" y="142" width="58" height="12" rx="4" fill="#99f6e4" stroke="#0f766e"/>
    <rect x="735" y="158" width="58" height="12" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="765" y="198" text-anchor="middle" class="head">Scheduler</text>
    <text x="765" y="220" text-anchor="middle" class="body">Queued on nextStartTime</text>
    <text x="765" y="240" text-anchor="middle" class="rule">R6</text>

    <rect x="890" y="104" width="180" height="160" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <path d="M950 136 H962 L980 122 V170 L962 156 H950 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M990 134 C998 142 998 150 990 158" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1000 126 C1014 140 1014 152 1000 166" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
    <text x="980" y="198" text-anchor="middle" class="head">Playback</text>
    <text x="980" y="220" text-anchor="middle" class="body">Continuous output</text>
    <text x="980" y="238" text-anchor="middle" class="body">to the speakers</text>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M210 184 H243"/><path d="M425 184 H458"/><path d="M640 184 H673"/><path d="M855 184 H888"/>
  </g>

  <rect x="200" y="296" width="700" height="48" rx="24" fill="#fef2f2" stroke="#fca5a5"/>
  <circle cx="232" cy="320" r="12" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M224 312 L240 328" stroke="#dc2626" stroke-width="2.5"/>
  <text x="560" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">On stop: disconnect the nodes and stop the tracks. Never call AudioContext.close() (R7)</text>
</svg>
