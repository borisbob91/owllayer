<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">One agent turn with OwlLayer AI</title>
  <desc id="desc">The UI declares tools and context, the user asks by text or voice, the agent picks a tool of the current screen, the risk policy checks it, your handler runs, and the agent answers with the real result. The next turn starts from the screen as it is now.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.07"/></filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 14px; fill: #475569; }
      .num { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .head { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 13px; fill: #475569; }
      .code { font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; fill: #1d4ed8; }
      .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; }
      .label { font-size: 12px; font-weight: 700; fill: #0f766e; }
    </style>
  </defs>

  <rect x="1" y="1" width="1098" height="538" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="550" y="44" text-anchor="middle" class="title">One agent turn with OwlLayer AI</text>
  <text x="550" y="70" text-anchor="middle" class="sub">Same path in text or voice. The agent requests actions; your application performs them.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="100" width="300" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="400" y="100" width="300" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="760" y="100" width="300" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="760" y="300" width="300" height="140" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="400" y="300" width="300" height="140" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="40" y="300" width="300" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  </g>

  <circle cx="72" cy="132" r="15" fill="#0f766e"/><text x="72" y="137" text-anchor="middle" class="num">1</text>
  <text x="98" y="138" class="head">The UI declares its tools</text>
  <text x="62" y="178" class="body">Buttons, fields and components become</text>
  <text x="62" y="198" class="body">tools, with context about the screen:</text>
  <text x="62" y="220" class="code">add_to_cart, set_shipping_city</text>

  <circle cx="432" cy="132" r="15" fill="#2563eb"/><text x="432" y="137" text-anchor="middle" class="num">2</text>
  <text x="458" y="138" class="head">The user asks</text>
  <text x="422" y="178" class="body">In the app's chat, by text or voice:</text>
  <text x="422" y="200" class="body" font-style="italic">"Add two headphones and check out."</text>

  <circle cx="792" cy="132" r="15" fill="#6d28d9"/><text x="792" y="137" text-anchor="middle" class="num">3</text>
  <text x="818" y="138" class="head">The agent picks a tool</text>
  <text x="782" y="178" class="body">Only tools of the current screen,</text>
  <text x="782" y="198" class="body">with input that matches their schema.</text>

  <circle cx="792" cy="332" r="15" fill="#d97706"/><text x="792" y="337" text-anchor="middle" class="num">4</text>
  <text x="818" y="338" class="head">The risk policy checks it</text>
  <rect x="930" y="289" width="116" height="22" rx="11" fill="#f59e0b"/>
  <text x="988" y="304" text-anchor="middle" class="tag" fill="#451a03">HUMAN IN LOOP</text>
  <text x="782" y="378" class="body"><tspan class="code" fill="#b45309">high</tspan> and <tspan class="code" fill="#b45309">critical</tspan> actions wait</text>
  <text x="782" y="398" class="body">for the user's approval.</text>

  <circle cx="432" cy="332" r="15" fill="#2563eb"/><text x="432" y="337" text-anchor="middle" class="num">5</text>
  <text x="458" y="338" class="head">Your handler runs</text>
  <rect x="598" y="289" width="88" height="22" rx="11" fill="#2563eb"/>
  <text x="642" y="304" text-anchor="middle" class="tag" fill="#ffffff">YOUR CODE</text>
  <text x="422" y="378" class="body">Inside your app, with your permissions,</text>
  <text x="422" y="398" class="body">transactions and business rules.</text>

  <circle cx="72" cy="332" r="15" fill="#15803d"/><text x="72" y="337" text-anchor="middle" class="num">6</text>
  <text x="98" y="338" class="head">The agent answers</text>
  <text x="62" y="378" class="body">With the real result:</text>
  <text x="62" y="400" class="body" font-style="italic">"Two items added. Please approve</text>
  <text x="62" y="418" class="body" font-style="italic">the payment of €298."</text>

  <g fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M340 170 H398"/>
    <path d="M700 170 H758"/>
    <path d="M910 240 V298"/>
    <path d="M760 370 H702"/>
    <path d="M400 370 H342"/>
  </g>
  <path d="M190 300 V242" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow-teal)"/>
  <text x="202" y="276" class="label">next turn: the screen and its tools may have changed</text>

  <rect x="40" y="468" width="1020" height="44" rx="22" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="70" y="495" font-size="13.5" fill="#075985"><tspan font-weight="700">AITP</tspan>: typed JSON messages over WebSocket between your app and the OwlLayer server</text>
  <text x="1030" y="495" text-anchor="end" font-size="13.5" font-weight="700" fill="#075985">Model keys stay on the server</text>
</svg>
